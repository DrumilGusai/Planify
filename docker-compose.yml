services:
  mysql:
    image: mysql:8.4
    container_name: planify-mysql
    environment:
      MYSQL_DATABASE: planify
      MYSQL_USER: planify
      MYSQL_PASSWORD: planify
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "planify", "-pplanify"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: planify-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: ./backend
    container_name: planify-backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: planify
      DB_USER: planify
      DB_PASS: planify
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-planify-dev-jwt-secret-key-at-least-32-bytes-long!}
      FRONTEND_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build: ./frontend
    container_name: planify-frontend
    depends_on:
      - app
    ports:
      - "5173:80"

volumes:
  mysql_data: {}
