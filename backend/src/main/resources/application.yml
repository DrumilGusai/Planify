spring:
  application:
    name: planify
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:planify}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:planify}
    password: ${DB_PASS:planify}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:planify-dev-jwt-secret-key-at-least-32-bytes-long!}
    access-ttl-min: 15
    refresh-ttl-days: 7
  cors:
    origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  cookie-secure: ${COOKIE_SECURE:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
